<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>打印窗口</title>
    <link href="./css/print-lock.css" rel="stylesheet" />
    <link href="./css/print-lock.css" media="print" rel="stylesheet" />
    <link href="./css/iconfont.css" rel="stylesheet" />
    <link href="./css/iconfont.css"  media="print" rel="stylesheet"/>
    <style>
      body { margin: 0; padding: 0; overflow: hidden; }
      #printf { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
    </style>
  </head>

  <body>
    <iframe id="printf" scrolling="no" style="overflow: hidden;"></iframe>
    <script>
      const { ipcRenderer } = require("electron");

      function onImgLoaded(doc, callback) {
        let imgs = doc.querySelectorAll("img");
        if (imgs.length === 0) return callback();
        let len = imgs.length;
        function cb() { len--; if (len <= 0) callback(); }
        imgs.forEach(img => {
          if (img.complete || !img.src) { cb(); return; }
          const test = new Image();
          test.onload = cb;
          test.onerror = cb;
          test.src = img.src;
        });
      }

      ipcRenderer.on("print-new", (event, data) => {
        console.log(event, data);
        document.title = data.title ? data.title : "hiprint打印";
        if (data.html == null) {
          ipcRenderer.send("do", data);
        } else {
          const iframe = document.getElementById("printf");
          const blob = new Blob([data.html], { type: "text/html" });
          const url = URL.createObjectURL(blob);
          iframe.src = url;
          iframe.onload = () => {
            data.pageNum = iframe.contentDocument.querySelectorAll(".hiprint-printPaper, .roy-preview-page").length;
            onImgLoaded(iframe.contentDocument, () => {
              ipcRenderer.send("do", data);
            });
          };
        }
      });
    </script>
  </body>
</html>
